<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PCIe 6.0">
<title>PCIe 6.0 学习系统</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" onclick="App.go('kb')">
        <span class="brand-logo">⚡</span>
        <div class="brand-text">
          <h1>PCIe 6.0 学习系统</h1>
          <span class="brand-sub">知识库 · 测验 · 错题集 · 学习计划</span>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="streak-chip" id="streakChip" title="连续学习天数">🔥 <b id="streakNum">0</b></div>
        <button class="icon-btn" id="themeBtn" title="切换深色/浅色">🌙</button>
      </div>
    </div>
    <div id="todayBanner" class="today-banner" hidden></div>
  </header>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-view="kb" onclick="App.go('kb')"><span class="tab-ico">📚</span><span>知识库</span></button>
    <button class="tab" data-view="quiz" onclick="App.go('quiz')"><span class="tab-ico">📝</span><span>测验</span></button>
    <button class="tab" data-view="wrong" onclick="App.go('wrong')"><span class="tab-ico">❌</span><span>错题集<span class="badge" id="wrongBadge"></span></span></button>
    <button class="tab" data-view="plan" onclick="App.go('plan')"><span class="tab-ico">📅</span><span>计划</span></button>
    <button class="tab" data-view="stats" onclick="App.go('stats')"><span class="tab-ico">📊</span><span>统计</span></button>
    <button class="tab" data-view="settings" onclick="App.go('settings')"><span class="tab-ico">⚙️</span><span>设置</span></button>
  </nav>

  <main id="main" class="main"></main>

  <footer class="footer">
    PCIe 6.0 学习系统 · 数据保存在本设备浏览器 · 记得定期导出备份 / 跨设备同步
  </footer>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/data-knowledge.js"></script>
<script src="js/data-questions.js"></script>
<script src="js/data-plan.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
